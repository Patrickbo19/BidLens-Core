name: Register INCOME 2 x402 directories

on:
  push:
    paths:
      - '.github/workflows/register-income2-directories.yml'

permissions:
  contents: read

jobs:
  register-market402:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit macro offer to Market402
        continue-on-error: true
        run: |
          curl -sS -X POST 'https://market402.com/submit' \
            -H 'content-type: application/json' \
            --data '{"resource":"https://income2-treasury.onrender.com/macro-snapshot"}' \
            -w '\nHTTP %{http_code}\n'

      - name: Submit extraction offer to Market402
        continue-on-error: true
        run: |
          curl -sS -X POST 'https://market402.com/submit' \
            -H 'content-type: application/json' \
            --data '{"resource":"https://earn-tools-backend.onrender.com/web-extract"}' \
            -w '\nHTTP %{http_code}\n'
