name: Register INCOME 2 x402 directories

on:
  push:
    paths:
      - '.github/workflows/register-income2-directories.yml'

permissions:
  contents: read

jobs:
  register-market402:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit macro offer to Market402
        continue-on-error: true
        run: |
          curl -sS -X POST 'https://market402.com/submit' \
            -H 'content-type: application/json' \
            --data '{"resource":"https://income2-treasury.onrender.com/macro-snapshot"}' \
            -w '\nHTTP %{http_code}\n'

      - name: Submit extraction offer to Market402
        continue-on-error: true
        run: |
          curl -sS -X POST 'https://market402.com/submit' \
            -H 'content-type: application/json' \
            --data '{"resource":"https://earn-tools-backend.onrender.com/web-extract"}' \
            -w '\nHTTP %{http_code}\n'

  register-true402:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register macro seller with true402
        continue-on-error: true
        run: |
          origin='https://income2-treasury.onrender.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS "$origin/.well-known/x402-service.json" >/dev/null; then
              curl -fsS -X POST 'https://true402.dev/api/v1/services' \
                -H 'content-type: application/json' \
                --data "{\"url\":\"$origin\"}"
              exit 0
            fi
            sleep 15
          done
          echo 'true402 macro descriptor did not become ready in time' >&2
          exit 1

      - name: Register extraction seller with true402
        continue-on-error: true
        run: |
          origin='https://earn-tools-backend.onrender.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS "$origin/.well-known/x402-service.json" >/dev/null; then
              curl -fsS -X POST 'https://true402.dev/api/v1/services' \
                -H 'content-type: application/json' \
                --data "{\"url\":\"$origin\"}"
              exit 0
            fi
            sleep 15
          done
          echo 'true402 extraction descriptor did not become ready in time' >&2
          exit 1
