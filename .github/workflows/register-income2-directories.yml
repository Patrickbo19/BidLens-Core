name: One-time INCOME 2 402Index registration

on:
  push:
    paths:
      - '.github/workflows/register-income2-directories.yml'

permissions:
  contents: read

jobs:
  register-402index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register Macro Snapshot with 402Index
        run: |
          curl -fsS -X POST 'https://402index.io/api/v1/register' \
            -H 'content-type: application/json' \
            --data '{"url":"https://income2-treasury.onrender.com/macro-snapshot","name":"INCOME 2 US Macro Snapshot Bundle","protocol":"x402","http_method":"GET","description":"One-call source-backed U.S. macro snapshot: Treasury yield curve, national debt, average Treasury rates, and labor-market indicators.","price_usd":0.025,"payment_asset":"USDC","payment_network":"Base","category":"data/finance","provider":"INCOME 2"}'

      - name: Register Web Extract with 402Index
        run: |
          curl -fsS -X POST 'https://402index.io/api/v1/register' \
            -H 'content-type: application/json' \
            --data '{"url":"https://earn-tools-backend.onrender.com/web-extract","name":"INCOME 2 Webpage to Clean Markdown","protocol":"x402","http_method":"POST","probe_body":"{\"url\":\"https://example.com\"}","description":"Convert a public webpage into clean Markdown plus metadata and links for research and RAG workflows.","price_usd":0.001,"payment_asset":"USDC","payment_network":"Base","category":"web/extraction","provider":"INCOME 2"}'
